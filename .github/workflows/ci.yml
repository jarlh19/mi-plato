name: CI

# Verifica, no despliega. Publicar la app y dar de alta claves son decisiones
# aparte y manuales.
on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo cancela la corrida anterior de la misma rama: sin esto, varios
# push seguidos dejan corridas viejas compitiendo por el runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    # Versión fija y no `ubuntu-latest`: esa etiqueta pasa a Ubuntu 26 el
    # 19-oct-2026, y un cambio de sistema operativo bajo los pies del CI se
    # descubre con una corrida roja sin que nadie haya tocado el código.
    # Migrar es cambiar este número, cuando convenga y no por sorpresa.
    runs-on: ubuntu-24.04
    steps:
      # v5 en vez de v4: la v4 corre sobre Node 20, ya obsoleto, y GitHub la
      # está forzando a Node 24 con un aviso en cada corrida.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Versión fija, la misma que la máquina donde se desarrolla. Con `stable`
      # a secas, el día que Flutter saque una versión nueva el CI cambiaría de
      # compilador sin que nadie lo decida, y un fallo así cuesta encontrarlo.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      # `--output=none` comprueba sin reescribir: el CI avisa, no corrige.
      # Para arreglarlo en local basta `dart format .`.
      - name: Formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test
