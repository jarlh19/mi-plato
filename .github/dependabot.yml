# Actualizaciones de dependencias (estándar E1 del escudo de seguridad).
# Una vez por semana; las versiones menores y los parches llegan juntos en un
# solo PR por ecosistema, y las mayores aparte, porque esas sí rompen cosas.
# Los parches de seguridad no esperan a la semana: los abre Dependabot apenas
# sale el aviso, si están activadas las actualizaciones de seguridad del repo.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/supabase"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
